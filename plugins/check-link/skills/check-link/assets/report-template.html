<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Link report</title>
<!-- Check Link visual report (SNRGX AI Library). Static page: it only draws the report from the JSON below.
     No network requests, no downloads, nothing installed or run. Built from the Check Link page design. -->
<style>
/* Layout: one inspection column — input bench on top, the report below it like a lab sheet with a verdict seal. Mirrors fully for Arabic (RTL). */
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --ink:#111111; --muted:#5E5E5E; --line:#D9D9D9;
  --accent:#111111; --accent-ink:#FFFFFF; --code:#F5F5F5;
  --green:#16794A; --green-bg:#E3F4EA; --amber:#9A6200; --amber-bg:#FDF1DA; --red:#B42318; --red-bg:#FDE7E4; --orange:#D2600A; --accent-soft:#EBEBEB; --lv-low:#2E9E62; --lv-med:#E2B100; --lv-high:#E8780F; --lv-crit:#D23B2E;
  --f-display:"Sora","IBM Plex Sans Arabic",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0D; --surface:#171717; --ink:#EDEDED; --muted:#A0A0A0; --line:#2E2E2E;
  --accent:#F2F2F2; --accent-ink:#111111; --code:#121212;
  --green:#5DD39A; --green-bg:#11301F; --amber:#F2B65A; --amber-bg:#33260E; --red:#FF8A7E; --red-bg:#3A1714; --orange:#FF9F4A; --accent-soft:#222222; --lv-low:#4CC487; --lv-med:#F2CC3A; --lv-high:#FF9A3D; --lv-crit:#FF6B5E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --surface:#171717; --ink:#EDEDED; --muted:#A0A0A0; --line:#2E2E2E;
  --accent:#F2F2F2; --accent-ink:#111111; --code:#121212;
  --green:#5DD39A; --green-bg:#11301F; --amber:#F2B65A; --amber-bg:#33260E; --red:#FF8A7E; --red-bg:#3A1714; --orange:#FF9F4A; --accent-soft:#222222; --lv-low:#4CC487; --lv-med:#F2CC3A; --lv-high:#FF9A3D; --lv-crit:#FF6B5E;
  color-scheme:dark}
:root[lang="ar"]{--f-display:"IBM Plex Sans Arabic","Sora",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
:root[lang="ar"] body{font-size:16px;line-height:1.75}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:root[lang="ar"] .eyebrow{font-family:var(--f-body);letter-spacing:0;font-size:13px}
header{display:flex;flex-direction:column;gap:6px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;padding:5px 14px;border-radius:999px;font-weight:500;font-size:13px;background:transparent;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button[lang="ar"]{font-family:"IBM Plex Sans Arabic",var(--f-body)}
header .by{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bench form{display:flex;gap:10px;flex-wrap:wrap}
.bench input[type=url]{flex:1 1 320px;min-width:0;font:inherit;font-family:var(--f-mono);font-size:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.bench input[type=url]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.alt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.alt label{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.alt input{position:absolute;width:1px;height:1px;opacity:0}
.steps .askbox{border:1px solid var(--ink);border-radius:12px;padding:14px;display:grid;gap:8px}
.steps .askbox .row{display:flex;gap:10px;flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.steps li{display:flex;gap:10px;align-items:baseline}
.steps .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none;transform:translateY(1px)}
.steps li.run .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1s infinite alternate}
.steps li.done .dot{border-color:var(--green);background:var(--green)}
.steps li.fail .dot{border-color:var(--red);background:var(--red)}
.steps li .d{color:var(--muted);font-size:13px}
@keyframes pulse{to{opacity:.35}}
@media (prefers-reduced-motion:reduce){.steps li.run .dot{animation:none}}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--code);border:1px solid var(--line)}
.note.err{background:var(--red-bg);border-color:transparent;color:var(--red)}
.example-tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--amber-bg);color:var(--amber)}
.ltr{direction:ltr;unicode-bidi:isolate}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.seal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;border:3px solid currentColor;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 7px currentColor;padding:8px}
:root[lang="ar"] .seal{letter-spacing:0;font-size:14px}
.v-green{color:var(--green)} .v-yellow{color:var(--amber)} .v-red{color:var(--red)}
.bg-green{background:var(--green-bg)} .bg-yellow{background:var(--amber-bg)} .bg-red{background:var(--red-bg)}
.verdict .headline{font-family:var(--f-display);font-size:20px;font-weight:600;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.mono{font-family:var(--f-mono);font-size:12.5px;direction:ltr;unicode-bidi:isolate}
@media (max-width:520px){.verdict{grid-template-columns:1fr}.seal{width:84px;height:84px}}

/* scores */
.scores{display:grid;gap:10px}
.score{display:grid;grid-template-columns:160px 1fr 30px;gap:12px;align-items:center;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--code);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.score .n{font-family:var(--f-mono);text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
.score .why{grid-column:2 / 4;font-size:13px;color:var(--muted);margin-top:-6px}
@media (max-width:520px){.score{grid-template-columns:1fr 38px}.score .bar{grid-column:1 / 3;grid-row:2}.score .why{grid-column:1 / 3;margin-top:0}}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
ul.clean{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.flag{border-inline-start:4px solid var(--lv-med);background:var(--amber-bg);border-start-end-radius:10px;border-end-end-radius:10px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.flag.critical{border-color:var(--red);background:var(--red-bg)}
.flag .where{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.flag .qmean{font-size:13px;color:var(--muted)}
.trnote{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.flag code,.hit code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere;display:inline-block;max-width:100%;direction:ltr;unicode-bidi:isolate;text-align:left}
.flags{display:grid;gap:10px}
.none{color:var(--green);font-weight:500}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
.hits{display:grid;gap:6px;margin-top:10px;font-size:13px}
.hit{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;min-width:0}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;align-self:start;white-space:nowrap}
.pill.critical{background:var(--red-bg);color:var(--red)} .pill.warning{background:var(--amber-bg);color:var(--amber)} .pill.doc{background:var(--code);color:var(--muted);border:1px solid var(--line)}
.files{width:100%;border-collapse:collapse;font-size:13px}
.files td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.files td:first-child{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere;direction:ltr;text-align:left}
.files td:last-child{text-align:end;color:var(--muted);white-space:nowrap}
.tablebox{overflow-x:auto;max-height:280px;overflow-y:auto}
.warnbar{padding:12px 14px;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:500}

/* before you install — the most important card */
.before{border:2px solid var(--accent);background:var(--accent-soft);padding:0;overflow:hidden;gap:0}
.vstrip{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 20px}
.vstrip .seal{width:72px;height:72px;font-size:11px;padding:6px}
:root[lang="ar"] .vstrip .seal{font-size:12px}
.vstrip .headline{font-family:var(--f-display);font-size:17px;font-weight:600;text-wrap:balance}
.before-head{display:flex;gap:12px;align-items:center;padding:18px 20px 6px}
.before-head h2{font-size:22px}
.before-head p{font-size:13px}
.ic-big{width:40px;height:40px;flex:none}
.todo{list-style:none;margin:0;padding:8px 20px 20px;display:grid;gap:10px}
.todo li{position:relative}
.todo input{position:absolute;opacity:0;width:1px;height:1px}
.todo label{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15px;font-weight:500;transition:border-color .15s,opacity .15s}
.todo .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700}
.todo input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.todo input:not(:checked) + label{opacity:.55;border-style:dashed}
.todo input:checked + label .num{background:var(--green);font-size:0}
.todo input:checked + label .num::after{content:"✓";font-size:18px;color:var(--accent-ink)}

.before > .warnbar,.before > .note{margin:0 20px 20px}

/* overall evaluation — visual */
.overall{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.big{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;color:var(--c)}
.num10{font-family:var(--f-display);line-height:1;display:inline-flex;align-items:baseline;gap:2px;direction:ltr;unicode-bidi:isolate}
.num10 b{font-size:56px;font-weight:700;color:var(--c)}
.num10 small{font-size:20px;color:var(--muted);font-weight:600}
.stars{display:inline-flex;gap:4px;direction:ltr}
.star{position:relative;width:30px;height:30px;display:inline-block}
.star svg{width:30px;height:30px;display:block}
.star .s-bg{fill:var(--line)}
.s-fill{position:absolute;inset:0 auto 0 0;overflow:hidden}
.s-fill svg path{fill:var(--c)}
.flagbtn{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;justify-items:start;background:var(--surface);border:2px solid var(--line);padding:10px 16px;border-radius:14px;color:var(--ink)}
.flagbtn .ic-flag{width:34px;height:34px;grid-row:1 / 3}
.flagbtn .fcount{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.flagbtn .fsub{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.flagbtn.has-crit{border-color:var(--red);color:var(--red)} .flagbtn.has-crit .fcount{color:var(--red)}
.flagbtn.has-warn{border-color:var(--lv-med);color:var(--amber)} .flagbtn.has-warn .fcount{color:var(--amber)}
.flagbtn.clean{border-color:var(--green);color:var(--green)}
.flagbtn:hover{background:var(--code)}
.metaline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);border-block:1px solid var(--line);padding-block:10px}
.metaline span{display:inline-flex;align-items:center;gap:5px}
.metaline b{color:var(--ink);font-weight:500}
.metaline .ltype{font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.metaline .nohttps,.metaline .nohttps b{color:var(--lv-high)}
a.btn{display:inline-flex;align-items:center;font-weight:600;border-radius:10px;padding:11px 18px;text-decoration:none;border:1px solid transparent}
a.btn.off{opacity:.45;pointer-events:none;cursor:not-allowed}
.ic-xs{width:15px;height:15px;flex:none}
.ic-sm{width:20px;height:20px;vertical-align:-3px}
#flags{scroll-margin-top:16px}
@media (max-width:520px){.overall{grid-template-columns:1fr}.num10 b{font-size:48px}.star,.star svg{width:26px;height:26px}}

/* risk profile */
.rp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.rp-block{display:grid;gap:10px;align-content:start;min-width:0}
.rp-block h3{font-size:15px;font-weight:600}
.matrix-wrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:6px;align-items:center}
.axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--muted);font-weight:600}
.axis-x{grid-column:2;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.matrix{display:grid;grid-template-columns:16px repeat(5,1fr);gap:3px}
.mcell{aspect-ratio:1;border-radius:6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;position:relative;min-width:0}
.mcell.low{background:color-mix(in srgb,var(--lv-low) 30%,var(--surface))} .mcell.med{background:color-mix(in srgb,var(--lv-med) 34%,var(--surface))} .mcell.high{background:color-mix(in srgb,var(--lv-high) 38%,var(--surface))} .mcell.crit{background:color-mix(in srgb,var(--lv-crit) 42%,var(--surface))}
.ylab,.xlab{font-size:11px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.mdot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--f-mono)}
.mdot.w{background:var(--lv-med);color:#2B2100} .mdot.c{background:var(--lv-crit)}
.mdot.sm{width:16px;height:16px;font-size:9px;display:inline-grid;vertical-align:-3px}
.you{position:absolute;inset:3px;border:3px solid var(--ink);border-radius:50%;pointer-events:none}
.you.sm{position:static;display:inline-block;width:14px;height:14px;border-width:2px;vertical-align:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.lvl-low{color:var(--green)} .lvl-med{color:var(--amber)} .lvl-high{color:var(--orange)} .lvl-crit{color:var(--red)}
.caps{display:grid;gap:6px}
.cap{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--code);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.cap svg{width:20px;height:20px}
.cap b{font-size:12px;font-weight:600}
.cap.on{color:var(--ink);border-color:var(--orange)} .cap.on svg,.cap.on b{color:var(--orange)}
.trifecta{font-size:13px;padding:8px 10px;border-radius:10px}
.trifecta.bad{background:var(--red-bg);color:var(--red);font-weight:600}
.trifecta.good{color:var(--green)}
.ast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:620px){.ast{grid-template-columns:repeat(2,minmax(0,1fr))}}
.astt{border-radius:10px;padding:8px 9px;display:grid;gap:2px;border:1px solid var(--line);background:var(--code);min-width:0}
.aid{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.aname{font-size:12.5px;font-weight:600;line-height:1.3}
.ast-st{font-size:12px;font-weight:600}
.astt.pass .ast-st{color:var(--green)} .astt.pass{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.astt.concern{background:var(--amber-bg);border-color:transparent} .astt.concern .ast-st{color:var(--amber)}
.astt.fail{background:var(--red-bg);border-color:var(--red)} .astt.fail .ast-st{color:var(--red)}
.astt.na{opacity:.6} .astt.na .ast-st{color:var(--muted)}
.src{font-size:12px}
.fnum{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--lv-med);color:#2B2100;font-size:11px;font-weight:700;font-family:var(--f-mono)}
.flag.critical .fnum{background:var(--lv-crit);color:#fff}
.ast{font-family:inherit}
span.ast{display:inline;font-family:var(--f-mono);font-size:11.5px;font-weight:600}

.before .before-head{padding:18px 20px 6px}
.todo .box{width:26px;height:26px;border-radius:7px;border:2.5px solid var(--accent);background:var(--surface);display:grid;place-items:center}
.todo label{grid-template-columns:26px 1fr}
.todo input:checked + label .box{background:var(--green);border-color:var(--green)}
.todo input:checked + label .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
/* criteria collapsible */
.crit-details{border-top:0;padding-top:0}
.crit-details summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--code);border:1px solid var(--line)}
.crit-details[open] summary{margin-bottom:14px}
.chips{display:inline-flex;gap:4px;direction:ltr}
.chip{min-width:30px;padding:2px 6px;border-radius:6px;text-align:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:#14110A}
/* legend bigger, stacked layout */
.rp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:640px){.rp{grid-template-columns:1fr}}
.rp-side{display:grid;gap:16px;min-width:0}
.matrix-wrap{width:100%}
.legend{font-size:15px;gap:10px;color:var(--ink);font-weight:500;display:grid;padding:12px 14px;border-radius:12px;background:var(--code);border:1px solid var(--line)}
.legend .lg-flag{display:inline-flex;align-items:center;gap:6px}
.legend .you.sm{width:18px;height:18px}
.rp-title{display:flex;align-items:center;gap:8px}
.ibtn{width:24px;height:24px;border-radius:50%;padding:0;display:inline-grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:14px;line-height:1}
.pop{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.pop a{color:var(--accent)}
.pop[hidden]{display:none}

.scalekey{display:flex;gap:4px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.scalekey span{flex:1;display:grid;gap:3px;text-align:center;max-width:80px}
.scalekey i{display:block;height:6px;border-radius:3px}
:root[dir="rtl"] .scalekey{justify-content:flex-end}

button.mdot{border:0;padding:0;cursor:pointer;transition:transform .12s}
button.mdot:hover{transform:scale(1.18)}
button.mdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend .lg-flag{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:start;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.legend .lg-flag:hover{text-decoration-color:currentColor}
.flag{scroll-margin:24px}
.flag.pulse{animation:flagpulse 1.6s ease-out}
.flag:focus{outline:none}
@keyframes flagpulse{0%,40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flag.pulse{animation:none;box-shadow:0 0 0 3px var(--accent)}}

.loading{flex-direction:row;align-items:center;gap:18px;padding:28px 20px}
.loading .ltitle{font-family:var(--f-display);font-size:20px;font-weight:600}
.spinner{width:40px;height:40px;flex:none;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:var(--line);border-right-color:var(--ink)}}

.todo-group{padding:4px 20px 0;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
:root[lang="ar"] .todo-group{text-transform:none;letter-spacing:0;font-size:13.5px}
.todo{padding-top:6px;padding-bottom:12px}
.promptbox{margin:4px 20px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.pb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pb-head h3{font-size:17px}
button.sm{padding:8px 14px;font-size:14px}
.where{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
#promptText{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:340px;overflow:auto;unicode-bidi:plaintext;text-align:start}
:root[lang="ar"] #promptText{font-family:var(--f-body);font-size:14px}

.flagbox{border-top:0;padding-top:0}
.flagbox > summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
.flagbox > summary::-webkit-details-marker{display:none}
.flagbox > summary h2{flex:1}
.fb-count{display:inline-flex;gap:6px}
.fbc{min-width:28px;height:24px;padding:0 8px;border-radius:999px;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:700}
.fbc.c{background:var(--lv-crit);color:#fff} .fbc.w{background:var(--lv-med);color:#2B2100} .fbc.ok{background:var(--lv-low);color:#fff}
.fb-chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.flagbox[open] .fb-chev{transform:rotate(-135deg) translateY(-2px)}
.fb-body{display:grid;gap:14px;margin-top:14px}
.flagbox > summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}

.ww-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scope{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;border:2px solid var(--ink)}
.sc-universal{background:var(--ink);color:var(--surface)}
.sc-multi{background:var(--surface);color:var(--ink)}
.sc-specific{background:var(--code);color:var(--muted);border-color:var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tool{border-radius:10px;padding:10px 12px;display:grid;gap:3px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.tname{font-weight:600;font-size:14px}
.tst{font-size:12.5px;font-weight:600}
.tool.st-yes{border-color:var(--ink)} .tool.st-yes .tst{color:var(--ink)}
.tool.st-adapt{border-style:dashed} .tool.st-adapt .tst{color:var(--muted)}
.tool.st-no{opacity:.5;background:var(--code)} .tool.st-no .tst{color:var(--muted)}
.found{font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.found code{font-family:var(--f-mono);font-size:12px;background:var(--code);border:1px solid var(--line);padding:2px 7px;border-radius:6px;direction:ltr}

button.tool{font:inherit;text-align:start;cursor:pointer;color:var(--ink)}
button.tool:hover{border-color:var(--ink)}
button.tool.sel{outline:2px solid var(--ink);outline-offset:1px}
button.tool.st-no{opacity:.65}
.tmore{font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.toolpanel{border:1.5px solid var(--ink);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--surface)}
.toolpanel[hidden]{display:none}
.toolpanel h3{font-size:17px}
.tp-label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
:root[lang="ar"] .tp-label{text-transform:none;letter-spacing:0;font-size:13.5px}
.tp-row{display:grid;gap:4px}
.tp-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spin-sm{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
.conv{display:grid;gap:10px}
.cfiles{display:grid;gap:6px}
.cfiles details{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cfiles summary code{font-family:var(--f-mono);font-size:12.5px;direction:ltr}
.cfiles pre{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12px;max-height:260px;overflow:auto;background:var(--code);padding:10px;border-radius:8px;unicode-bidi:plaintext}

#toolsBox .tools{margin-bottom:12px}
#toolsBox[open] summary{margin-bottom:14px}
#toolsBox > .toolpanel{margin-bottom:12px}
.chips.trow{direction:inherit}
.tchip{min-width:26px;height:24px;border-radius:6px;display:inline-grid;place-items:center;font-size:13px;font-weight:700}
.tc-yes{background:var(--ink);color:var(--surface)}
.tc-adapt{border:1.5px dashed var(--ink);color:var(--ink)}
.tc-no{background:var(--line);color:var(--muted)}

.ww-sum{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.scope.sm{font-size:11.5px;padding:2px 9px;border-width:1.5px}
.crit-details + .crit-details{margin-top:-4px}

.pill.fa{background:var(--code);color:var(--muted);border:1px dashed var(--line)}
.pill.conf{background:var(--lv-crit);color:#fff}
.hit.hs-fa code{opacity:.7}
.hreason{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.hit.hs-conf .hreason{color:var(--red)}

.brandlogo{height:35px;width:auto;color:var(--ink);display:block;flex:none}
@media (max-width:520px){.brandlogo{height:29px}}
header{gap:8px}
header > .eyebrow{margin-top:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-sep{width:1.5px;align-self:stretch;margin-block:6px;background:var(--line)}
.brand-lib{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
@media (max-width:520px){.brand{gap:10px}.brand-lib{font-size:16px}}

/* approve */
.approve{border:2px solid var(--accent)}
.approve .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent);flex:none}
footer{font-size:12.5px;color:var(--muted);text-align:center;display:grid;gap:10px;justify-items:center}
.whatsnew{border:0;padding:0;text-align:start;max-width:640px}
.whatsnew summary{cursor:pointer;font-weight:600;color:var(--ink);text-align:center;list-style:none}
.whatsnew summary::-webkit-details-marker{display:none}
.vbadge{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface)}
.whatsnew ul{margin:10px 0 6px;padding-inline-start:18px;display:grid;gap:4px;font-size:13px;color:var(--ink)}
.whatsnew a{color:var(--ink)}
</style>

const stepOf = x => typeof x === "string" ? x : (x?.step || "");
const aiOf = x => typeof x === "string" ? x : (x?.ai || x?.step || "");
function installItems(r, s){
  if (s.meta.page) return pageItems(r, s);
  const m = s.meta, P = T[LANG].rules, E = T.en.rules, out = [];
  (r.before_install||[]).forEach((x,i)=>{ const st = stepOf(x); if (st) out.push({g:"check", id:"c"+i, step:st, ai: s.isExample ? aiOf(EXAMPLE.en.before_install[i]) : aiOf(x)}); });
  out.push({g:"rules", id:"r1", step:P.confirm[0], ai:E.confirm[1]});
  out.push({g:"rules", id:"r2", step:P.project[0], ai:E.project[1]});
  out.push({g:"rules", id:"r3", step:P.pin[0], ai:E.pin[1](m.sha || "")});
  if (s.scope) out.push({g:"rules", id:"r4", step:P.folder[0](s.scope), ai:E.folder[1](s.scope)});
  out.push({g:"rules", id:"r5", step:P.noauto[0], ai:E.noauto[1]});
  out.push({g:"rules", id:"r6", step:P.list[0], ai:E.list[1]});

}
function pageItems(r, s){
  const R = T[LANG].rulesPage, k = s.linkType, out = [];
  (r.before_open||[]).forEach((x,i)=>{ const st = stepOf(x); if (st) out.push({g:"check", id:"c"+i, step:st, ai:aiOf(x)}); });
  const ids = k==="media" ? ["addr","data"] : k==="download" ? ["addr","nodl","av"] : k==="short" ? ["addr","nopass","nodl","data"] : k==="program" ? ["addr","nodl","av"] : k==="archive" ? ["addr","nodl","av","data"] : k==="document" ? ["addr","nopass","macro","nodl","av","data"] : ["addr","nopass","nodl","data"];
  ids.forEach(id => out.push({g:"rules", id:"p-"+id, step:R[id][0], ai:T.en.rulesPage[id][1]}));
  return out;
}
function buildPagePromptText(){

function buildInstallPrompt(){

  const picked = [...document.querySelectorAll('.todo input[data-ai]:checked')].map(i=>i.dataset.ai);
  const v = ["green","yellow","red"].includes(r.verdict) ? r.verdict : "yellow";
  const lvl = EN.risk.levelRisk[{green:"low",yellow:"med",red:"high"}[v]];
  const flags = (r.red_flags||[]).length;

  const L = [Q.intro, "", `${Q.skill}: ${name}`, `${Q.source}: ${src}`];

const TOOLS = ["claude_app","claude_code","chatgpt","codex","gemini","cursor","copilot"];
const TOOL_NAMES = {claude_app:"Claude",claude_code:"Claude Code",chatgpt:"ChatGPT",codex:"OpenAI Codex",gemini:"Gemini CLI",cursor:"Cursor",copilot:"GitHub Copilot"};
const SIGNALS = [
  {id:"skill",   label:"SKILL.md",             re:/(^|\/)SKILL\.md$/i},
  {id:"claudep", label:".claude-plugin",       re:/(^|\/)\.claude-plugin\//},
  {id:"claudemd",label:"CLAUDE.md",            re:/(^|\/)CLAUDE\.md$/},
  {id:"codex",   label:".codex / AGENTS.md",   re:/(^|\/)(\.codex(-plugin)?\/|AGENTS\.md$)/},
  {id:"gemini",  label:".gemini / GEMINI.md",  re:/(^|\/)(\.gemini\/|GEMINI\.md$|gemini-extension\.json$)/},
  {id:"cursor",  label:".cursor rules",        re:/(^|\/)(\.cursor\/|\.cursorrules$)|\.mdc$/},
  {id:"copilot", label:"Copilot instructions", re:/(^|\/)\.github\/(copilot-instructions\.md|prompts\/|agents\/)/},
  {id:"mcp",     label:"MCP server",           re:/(^|\/)(\.mcp\.json|mcp\.json|server\.json)$/},
];
function detectSignals(files){
  const paths = files.map(f=>f.path);
  const found = SIGNALS.filter(sg => paths.some(p => sg.re.test(p)));
  if (!found.some(x=>x.id==="mcp") && files.some(f => /package\.json$|pyproject\.toml$|requirements\.txt$/.test(f.path) && /modelcontextprotocol|fastmcp|\bmcp\b/i.test(f.text||"")))
    found.push(SIGNALS.find(x=>x.id==="mcp"));
  return found;
}
function fallbackCompat(sig){

  TOOLS.forEach(k=>t[k]="adapt");
  if (has("skill")){ t.claude_app="yes"; t.claude_code="yes"; }
  if (has("claudep") || has("claudemd")) t.claude_code="yes";
  if (has("codex")) t.codex="yes";
  if (has("gemini")) t.gemini="yes";
  if (has("cursor")) t.cursor="yes";
  if (has("copilot")) t.copilot="yes";
  if (has("mcp")) TOOLS.forEach(k=>t[k]="yes");
  const yes = TOOLS.filter(k=>t[k]==="yes").length;
  return {scope: yes>=5 ? "universal" : yes>=2 ? "multi" : "specific", tools:t, summary:""};
}
function worksWith(r, s){

  const c = (r.compat && r.compat.tools) ? r.compat : fallbackCompat(sig);
  const scope = ["universal","multi","specific"].includes(c.scope) ? c.scope : "multi";
  return `<details class="crit-details" id="toolsBox">
      <summary><span class="ww-sum"><span>${esc(C.title)}</span><span class="scope sm sc-${scope}">${esc(C.scope[scope])}</span></span><span class="chips trow">${TOOLS.map(k=>{ const st = ["yes","adapt","no"].includes(c.tools[k]) ? c.tools[k] : "adapt"; return `<span class="tchip tc-${st}" title="${esc(TOOL_NAMES[k]+" · "+C.st[st])}">${{yes:"✓",adapt:"~",no:"✕"}[st]}</span>`; }).join("")}</span></summary>
    ${c.summary ? `<p class="muted" style="font-size:14px;margin-bottom:12px">${esc(c.summary)}</p>` : ""}
    <div class="tools">${TOOLS.map(k=>{ const st = ["yes","adapt","no"].includes(c.tools[k]) ? c.tools[k] : "adapt";
      const inner = `<span class="tname ltr">${esc(TOOL_NAMES[k])}</span><span class="tst">${{yes:"✓",adapt:"~",no:"✕"}[st]} ${esc(C.st[st])}</span>`;
      return st==="yes" ? `<div class="tool st-yes">${inner}</div>`
        : `<button type="button" class="tool st-${st}" data-tool="${k}" aria-expanded="false" aria-controls="toolPanel">${inner}<span class="tmore">${esc(st==="adapt"?C.tapAdapt:C.tapNo)}</span></button>`; }).join("")}</div>
    <div class="toolpanel" id="toolPanel" hidden></div>
    ${sig.length ? `<p class="found"><span class="muted">${esc(C.found)}:</span> ${sig.map(x=>`<code>${esc(x.label)}</code>`).join(" ")}</p>` : ""}
